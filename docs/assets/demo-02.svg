<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><rect width="960" height="540" fill="#f6f2eb"/><rect x="42" y="35" width="876" height="470" rx="12" fill="#fffdf9"/><rect x="42" y="35" width="196" height="470" rx="12" fill="#213c47"/><text x="70" y="78" fill="#e5ad96" font-family="Arial" font-size="11" font-weight="700" letter-spacing="2">INTERVIEW FLOW</text><circle cx="140" cy="174" r="51" fill="#efd0c2"/><circle cx="140" cy="174" r="41" fill="#223143"/><text x="140" y="270" fill="#fffaf4" font-family="Georgia" font-size="22" text-anchor="middle">林知夏</text><rect x="278" y="157" width="500" height="74" rx="12" fill="#eaf0ed"/><text x="300" y="190" fill="#435952" font-family="Arial" font-size="15">你如何划分前端、模型服务和语音会话的边界？</text><rect x="379" y="250" width="420" height="88" rx="12" fill="#dc7358"/><text x="402" y="284" fill="#fffaf4" font-family="Arial" font-size="15">我会把界面、业务编排和外部服务拆分，</text><text x="402" y="308" fill="#fffaf4" font-family="Arial" font-size="15">让某一环失败时其余练习仍可继续。</text><rect x="278" y="360" width="500" height="74" rx="12" fill="#eaf0ed"/><text x="300" y="394" fill="#435952" font-family="Arial" font-size="15">那评分模型输出不完整时，你怎样保证反馈仍有用？</text></svg>
